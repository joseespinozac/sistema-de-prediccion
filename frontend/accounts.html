<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cuentas · Predictor de Tráfico E3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <div id="app-shell">
      <!-- Skeleton: ocupa el espacio del sidebar mientras shell.js inyecta. -->
      <div class="hidden md:block md:w-56 md:border-r md:border-gray-200 md:bg-white md:min-h-screen"></div>
    </div>

    <main class="px-4 py-6 max-w-5xl w-full" x-data="accountsPage()" x-init="init()">
      <h1 class="text-xl font-semibold mb-1">Cuentas conectadas</h1>
      <p class="text-sm text-gray-500 mb-6" x-text="summaryText()"></p>

      <!-- Toolbar -->
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
          <input
            type="checkbox"
            x-model="showInactive"
            :disabled="inactiveCount === 0"
            class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 disabled:opacity-50"
          />
          <span :class="inactiveCount === 0 ? 'text-gray-400' : ''">
            Mostrar inactivas (<span x-text="inactiveCount"></span>)
          </span>
        </label>
        <a href="/connect.html" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md px-4 py-2">
          + Conectar nueva cuenta
        </a>
      </div>

      <!-- Empty state -->
      <div
        x-show="filteredAccounts.length === 0"
        x-cloak
        class="bg-white border border-gray-200 rounded-xl p-8 text-center"
      >
        <p class="text-gray-600 mb-3" x-text="emptyMessage()"></p>
        <a
          href="/connect.html"
          class="inline-block bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md px-4 py-2"
        >
          Conectar una cuenta de Google
        </a>
      </div>

      <!-- Tabla de cuentas -->
      <div
        x-show="filteredAccounts.length > 0"
        x-cloak
        class="bg-white border border-gray-200 rounded-xl overflow-hidden"
      >
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-left text-gray-500 border-b border-gray-200">
            <tr>
              <th class="py-2 px-3 font-medium">Nombre</th>
              <th class="py-2 px-3 font-medium">GA4 property</th>
              <th class="py-2 px-3 font-medium">GSC site</th>
              <th class="py-2 px-3 font-medium">Estado</th>
              <th class="py-2 px-3 text-right font-medium">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="acc in filteredAccounts" :key="acc.id">
              <tr class="border-b border-gray-100" :class="acc.activo ? '' : 'bg-gray-50'">
                <td class="py-2 px-3 font-medium" :class="acc.activo ? 'text-gray-900' : 'text-gray-400'">
                  <span x-text="acc.nombre"></span>
                </td>
                <td class="py-2 px-3 font-mono text-xs text-gray-600" x-text="acc.ga4_property_id || '—'"></td>
                <td class="py-2 px-3 font-mono text-xs text-gray-600" x-text="acc.gsc_site_url || '—'"></td>
                <td class="py-2 px-3">
                  <span x-show="acc.activo" class="text-emerald-700 text-xs font-medium">● activa</span>
                  <span x-show="!acc.activo" class="text-gray-400 text-xs">○ inactiva</span>
                </td>
                <td class="py-2 px-3 text-right whitespace-nowrap">
                  <button
                    @click="openEdit(acc)"
                    class="text-blue-600 hover:underline text-xs mr-3"
                    :disabled="!acc.activo"
                  >Editar</button>
                  <button
                    x-show="acc.activo"
                    @click="openDelete(acc)"
                    class="text-red-600 hover:underline text-xs"
                  >Eliminar</button>
                  <button
                    x-show="!acc.activo"
                    @click="reactivar(acc)"
                    class="text-blue-600 hover:underline text-xs"
                  >Reactivar</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Modal de edición -->
      <div
        x-show="editing"
        x-cloak
        class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
        @click.self="closeEdit()"
      >
        <div class="bg-white rounded-xl border border-gray-200 shadow-lg w-full max-w-md p-6">
          <h2 class="text-base font-semibold mb-4">Editar nombre</h2>
          <form @submit.prevent="saveEdit()">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <input
              x-model="editForm.nombre"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <p x-show="editError" x-cloak class="mt-2 text-sm text-red-600" x-text="editError"></p>
            <div class="mt-5 flex justify-end gap-2">
              <button
                type="button"
                @click="closeEdit()"
                class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-md"
              >Cancelar</button>
              <button
                type="submit"
                :disabled="saving"
                class="bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white text-sm font-medium rounded-md px-4 py-2"
              >
                <span x-show="!saving">Guardar</span>
                <span x-show="saving" x-cloak>Guardando…</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Modal de confirmación de eliminación -->
      <div
        x-show="deleting"
        x-cloak
        class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
        @click.self="closeDelete()"
      >
        <div class="bg-white rounded-xl border border-gray-200 shadow-lg w-full max-w-md p-6">
          <h2 class="text-base font-semibold mb-2">Eliminar cuenta</h2>
          <p class="text-sm text-gray-700 mb-1">
            ¿Eliminar "<span x-text="deleting?.nombre" class="font-medium"></span>"?
          </p>
          <p class="text-sm text-gray-500 mb-5">
            Los datos históricos (tráfico, predicciones, alertas, estrategia) se conservan
            y la cuenta se puede reactivar después.
          </p>
          <p x-show="deleteError" x-cloak class="mb-3 text-sm text-red-600" x-text="deleteError"></p>
          <div class="flex justify-end gap-2">
            <button
              type="button"
              @click="closeDelete()"
              class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-md"
            >Cancelar</button>
            <button
              type="button"
              @click="confirmDelete()"
              :disabled="deletingLoading"
              class="bg-red-600 hover:bg-red-700 disabled:opacity-60 text-white text-sm font-medium rounded-md px-4 py-2"
            >
              <span x-show="!deletingLoading">Eliminar</span>
              <span x-show="deletingLoading" x-cloak>Eliminando…</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      function accountsPage() {
        return {
          accounts: [],
          showInactive: false,
          editing: null,
          editForm: { nombre: '' },
          editError: '',
          saving: false,
          deleting: null,
          deletingLoading: false,
          deleteError: '',

          // El shell (appShell) ya carga el usuario y expone logout.
          // Esta pagina solo necesita sus datos de dominio (cuentas).
          async init() {
            await this.loadAccounts();
          },

          async loadAccounts() {
            try {
              const data = await API.get('/api/accounts?includeInactive=true');
              this.accounts = data.accounts || [];
            } catch (e) {
              console.error('loadAccounts:', e);
            }
          },

          get activeAccounts() {
            return this.accounts.filter((a) => a.activo);
          },
          get inactiveAccounts() {
            return this.accounts.filter((a) => !a.activo);
          },
          get inactiveCount() {
            return this.inactiveAccounts.length;
          },
          get filteredAccounts() {
            return this.showInactive ? this.accounts : this.activeAccounts;
          },

          summaryText() {
            const active = this.activeAccounts.length;
            const inactive = this.inactiveAccounts.length;
            if (active === 0 && inactive === 0) {
              return 'Aún no has conectado ninguna cuenta de Google.';
            }
            const a = `${active} activa${active === 1 ? '' : 's'}`;
            if (inactive === 0) return `${a}.`;
            return `${a}, ${inactive} inactiva${inactive === 1 ? '' : 's'}.`;
          },

          emptyMessage() {
            if (this.accounts.length === 0) return 'No tienes cuentas conectadas.';
            if (this.showInactive) return 'No hay cuentas inactivas.';
            return 'No tienes cuentas activas.';
          },

          openEdit(acc) {
            this.editing = acc;
            this.editForm = { nombre: acc.nombre };
            this.editError = '';
          },
          closeEdit() {
            this.editing = null;
            this.editError = '';
          },
          async saveEdit() {
            const nombre = this.editForm.nombre?.trim();
            if (!nombre) {
              this.editError = 'El nombre no puede estar vacío.';
              return;
            }
            this.saving = true;
            this.editError = '';
            try {
              await API.patch(`/api/accounts/${this.editing.id}`, { nombre });
              await this.loadAccounts();
              this.closeEdit();
            } catch (e) {
              this.editError = e.message;
            } finally {
              this.saving = false;
            }
          },

          openDelete(acc) {
            this.deleting = acc;
            this.deleteError = '';
          },
          closeDelete() {
            this.deleting = null;
            this.deleteError = '';
          },
          async confirmDelete() {
            this.deletingLoading = true;
            this.deleteError = '';
            try {
              await API.del(`/api/accounts/${this.deleting.id}`);
              await this.loadAccounts();
              this.closeDelete();
            } catch (e) {
              this.deleteError = e.message;
            } finally {
              this.deletingLoading = false;
            }
          },

          async reactivar(acc) {
            try {
              await API.patch(`/api/accounts/${acc.id}`, { activo: true });
              await this.loadAccounts();
            } catch (e) {
              console.error('reactivar:', e);
            }
          },
        };
      }
    </script>

    <script src="/js/api.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/shell.js"></script>
  </body>
</html>
