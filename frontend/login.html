<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar · Predictor de Tráfico E3</title>
    <!-- Tailwind vía CDN en desarrollo (build de producción: npm run build:css). -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/api.js"></script>
  </head>
  <body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div
      class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-gray-200 p-6"
      x-data="loginForm()"
    >
      <h1 class="text-lg font-semibold text-gray-900">Predictor de Tráfico E3</h1>
      <p class="text-sm text-gray-500 mb-5">Acceso del equipo</p>

      <!-- Estado de error -->
      <div
        x-show="error"
        x-cloak
        class="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-md px-3 py-2"
        x-text="error"
      ></div>

      <form @submit.prevent="submit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            x-model="email"
            required
            autocomplete="username"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input
            type="password"
            x-model="password"
            required
            autocomplete="current-password"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <button
          type="submit"
          :disabled="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white text-sm font-medium rounded-md px-3 py-2 transition"
        >
          <span x-show="!loading">Ingresar</span>
          <span x-show="loading" x-cloak>Ingresando…</span>
        </button>
      </form>

      <p class="mt-4 text-xs text-gray-400">
        Usuario demo: <span class="font-mono">demo@e3.com</span> /
        <span class="font-mono">demo1234</span>
      </p>
    </div>

    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>

    <script>
      function loginForm() {
        return {
          email: '',
          password: '',
          loading: false,
          error: '',
          async submit() {
            this.error = '';
            this.loading = true;
            try {
              await API.post('/api/auth/login', {
                email: this.email,
                password: this.password,
              });
              location.href = '/index.html';
            } catch (e) {
              this.error = e.message;
            } finally {
              this.loading = false;
            }
          },
        };
      }
    </script>
  </body>
</html>
